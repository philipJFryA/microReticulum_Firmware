; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = 
	rnode-ng-20
	rnode-ng-21
	ttgo-t-beam
	ttgo-t-beam-sx1262
	ttgo-t-beam-supreme
	lilygo-t3-s3
	lilygo-t3-s3-sx127x
	lilygo-t3-s3-sx1280-pa
	lilygo-t-deck
	ttgo-lora32-v1
	ttgo-lora32-v2
	ttgo-lora32-v2-extled
	ttgo-lora32-v21
	ttgo-lora32-v21-extled
	ttgo-lora32-v21-tcxo
	heltec_wifi_lora_32_V2
	heltec_wifi_lora_32_V2-extled
	heltec_wifi_lora_32_V3
	heltec_wifi_lora_32_V4
	heltec-wireless-tracker-v2
	featheresp32
	seeed_xiao_esp32s3
	generic-esp32
	wiscore_rak4631
	wiscore_rak3401
	lilygo-t-echo
include_dir = .
src_dir = .

[env]
debug_build_flags = -Os
build_unflags = 
	-std=gnu++11
	-fno-exceptions
build_flags = 
	-std=gnu++17
	-fexceptions
	-O0
	-Wall
	-Wno-missing-field-initializers -Wno-format
	-I.
	-DNDEBUG
	-DHAS_RNS
	-DHAS_PROVISIONING
	-DRNS_USE_PROVISIONING
	-DRNS_ENABLE_REMOTE_PROVISIONING
	-DLORA_TRANSPORT
	-DRNS_LOG_LEVEL=RNS_LOG_LEVEL_TRACE
	-DRNS_LOW_MEMORY_REBOOT
	-DRNS_USE_FS
	-DURTN_STATS_PAGES
	-DMSGPACK_USE_BOOST=OFF
	-DDEBUGLOG_DEFAULT_LOG_LEVEL_ERROR
lib_deps = 
	ArduinoJson@^7.4.2
	MsgPack@^0.4.2
	https://github.com/attermann/Crypto.git
build_src_filter = -<*> +<*.ino> +<*.cpp>
extra_scripts = pre:extra_script.py

[env:embedded]
framework = arduino
monitor_speed = 115200
build_unflags = 
	${env.build_unflags}
	-std=gnu++11
build_flags = 
	${env.build_flags}
	-std=gnu++17
build_src_filter = 
	${env.build_src_filter}
	+<native/ws_shims/>
lib_deps = 
	${env.lib_deps}
	adafruit/Adafruit SSD1306@^2.5.9

[env:embedded-esp32]
extends = env:embedded
build_unflags = 
	${env:embedded.build_unflags}
	-Og
	-DRNS_LOG_LEVEL=RNS_LOG_LEVEL_TRACE
build_flags = 
	${env:embedded.build_flags}

[env:embedded-esp32-minimal]
extends = env:embedded-esp32
build_unflags = 
	${env:embedded-esp32.build_unflags}
	-Og
	-DRNS_LOG_LEVEL=RNS_LOG_LEVEL_TRACE
build_flags = 
	${env:embedded-esp32.build_flags}
	-Os
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
	-fno-inline-functions
	-fno-inline-small-functions
	-fno-use-cxa-atexit
	-fmerge-all-constants
	-Wall
	-Wno-missing-field-initializers
	-Wno-format
	-DRNS_LOG_LEVEL=RNS_LOG_LEVEL_VERBOSE
lib_deps = 
	${env:embedded.lib_deps}
	WiFi@^2.0.0

[env:embedded-nrf52]
extends = env:embedded
build_unflags = 
	${env:embedded.build_unflags}
	-fno-exceptions
	-fno-rtti
	--specs=nano.specs
build_flags = 
	${env:embedded.build_flags}
	-fexceptions
	-frtti
	--specs=nosys.specs
	-Wl,--wrap=_write

[env:embedded-nrf52-minimal]
extends = env:embedded-nrf52
build_unflags = 
	${env:embedded-nrf52.build_unflags}
	-Og
build_flags = 
	${env:embedded-nrf52.build_flags}
	-Os
	-fno-inline-functions
	-fno-inline-small-functions
	-fno-use-cxa-atexit
	-fmerge-all-constants
	-DDISABLE_IA

[env:rnode-ng-20]
extends = env:embedded-esp32-minimal
platform = platformio/espressif32 @ 6.9.0
board = ttgo-lora32-v2
custom_variant = ng20
